name: CI

on:
  push:
    branches: [main, pr-base]
  pull_request:
    branches: [main, pr-base]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Verify openclaw is on the latest version
        run: |
          LATEST=$(npm view openclaw version)
          echo "Latest openclaw on npm: $LATEST"

          CURRENT_DEV=$(node -p "require('./package.json').devDependencies.openclaw")
          CURRENT_BUILT=$(node -p "require('./package.json').openclaw.compat.builtWithOpenClawVersion")
          CURRENT_SDK=$(node -p "require('./package.json').openclaw.compat.pluginSdkVersion")
          CURRENT_DEV_VERSION=$(echo "$CURRENT_DEV" | sed -E 's/^[^0-9]*//')

          FAIL=0
          if [ "$CURRENT_DEV_VERSION" != "$LATEST" ]; then
            echo "::error::devDependencies.openclaw is \"$CURRENT_DEV\" (resolves to $CURRENT_DEV_VERSION), latest on npm is $LATEST. Bump it before merging."
            FAIL=1
          fi
          if [ "$CURRENT_BUILT" != "$LATEST" ]; then
            echo "::error::openclaw.compat.builtWithOpenClawVersion is \"$CURRENT_BUILT\", latest on npm is $LATEST. Bump it before merging."
            FAIL=1
          fi
          if [ "$CURRENT_SDK" != "$LATEST" ]; then
            echo "::error::openclaw.compat.pluginSdkVersion is \"$CURRENT_SDK\", latest on npm is $LATEST. Bump it before merging."
            FAIL=1
          fi
          if [ "$FAIL" = "1" ]; then
            echo "Run: npm install --save-dev openclaw@$LATEST && npm pkg set openclaw.compat.builtWithOpenClawVersion=$LATEST openclaw.compat.pluginSdkVersion=$LATEST"
            exit 1
          fi
          echo "All openclaw version fields are up to date ($LATEST)."
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build
