name: OpenClaw Version Test

on:
  pull_request:
    branches: [main]
  schedule:
    # Mondays 08:00 UTC ≈ 9am Prague (CET winter) / 10am Prague (CEST summer).
    - cron: "0 8 * * 1"
  workflow_dispatch:

jobs:
  test:
    name: OpenClaw Version Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test plugin install against every supported OpenClaw version
        shell: bash
        run: |
          set -uo pipefail

          # Floor matches the peer-dep in package.json.
          FLOOR="2026.4.15"

          echo "::group::Discovering OpenClaw versions"
          all=$(npm view openclaw versions --json)
          stable=$(echo "$all" | jq -r '.[] | select(test("-") | not)')

          versions=()
          for v in $stable; do
            if npx -y semver -r ">=$FLOOR" "$v" >/dev/null 2>&1; then
              versions+=("$v")
            fi
          done

          if [ ${#versions[@]} -eq 0 ]; then
            echo "No supported OpenClaw versions found (floor=$FLOOR)." >&2
            exit 1
          fi
          echo "Will test: ${versions[*]}"
          echo "::endgroup::"

          declare -A results
          overall_pass=1

          test_one() {
            local version="$1"
            local workdir
            workdir=$(mktemp -d)
            cd "$workdir"

            npm init -y >/dev/null 2>&1 || return 1
            npm install "openclaw@${version}" >/dev/null 2>&1 || return 1
            npx --no-install openclaw plugins install @apify/apify-openclaw-plugin@latest >/dev/null 2>&1 || return 2

            local list_output
            list_output=$(npx --no-install openclaw plugins list 2>&1) || return 3
            echo "$list_output" | grep -q "apify-openclaw-plugin" || return 4

            local inspect_json
            inspect_json=$(npx --no-install openclaw plugins inspect apify-openclaw-plugin --runtime --json 2>&1) || return 5
            echo "$inspect_json" | jq -e '.. | strings | select(. == "apify")' >/dev/null 2>&1 || return 6

            return 0
          }

          for v in "${versions[@]}"; do
            echo "::group::Testing OpenClaw $v"
            if test_one "$v"; then
              echo "PASS — OpenClaw $v"
              results["$v"]="✅ PASS"
            else
              code=$?
              case $code in
                1) reason="npm install openclaw failed" ;;
                2) reason="openclaw plugins install failed" ;;
                3) reason="openclaw plugins list errored" ;;
                4) reason="plugin not in 'plugins list' output" ;;
                5) reason="openclaw plugins inspect errored" ;;
                6) reason="'apify' tool not found in inspect output" ;;
                *) reason="unknown error (code $code)" ;;
              esac
              echo "FAIL — OpenClaw $v — $reason"
              results["$v"]="❌ FAIL — $reason"
              overall_pass=0
            fi
            echo "::endgroup::"
          done

          {
            echo "# OpenClaw Version Test Results"
            echo ""
            echo "Tested install of \`@apify/apify-openclaw-plugin@latest\` against ${#versions[@]} stable OpenClaw version(s) (>= $FLOOR)."
            echo ""
            echo "| OpenClaw Version | Result |"
            echo "|---|---|"
            for v in "${versions[@]}"; do
              echo "| \`$v\` | ${results[$v]} |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

          echo ""
          echo "==================== SUMMARY ===================="
          for v in "${versions[@]}"; do
            printf "  %-12s  %s\n" "$v" "${results[$v]}"
          done
          echo "================================================="

          if [ "$overall_pass" -ne 1 ]; then
            echo "One or more OpenClaw versions failed the smoke test."
            exit 1
          fi
