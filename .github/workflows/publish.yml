name: Release & Publish to npm and ClawHub

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.APIFY_SERVICE_ACCOUNT_GITHUB_TOKEN }}
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Set up Node.js & cache npm
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      # npm trusted publishing (OIDC) needs npm >= 11.5. Node 22 ships npm 10.x,
      # so we upgrade. Running `npm install -g npm@latest` with the bundled npm
      # races against itself (it overwrites its own files mid-execution, then
      # fails to `require` removed internal modules). Use npx to fetch
      # npm@latest into a separate location and let *that* npm do the global
      # install — running process and target path are distinct, no race.
      - name: Upgrade npm for trusted publishing
        run: |
          npx -y npm@latest install -g npm@latest
          npm --version

      - name: Install dependencies
        run: npm ci

      # Gate publishing on the pinned openclaw version matching npm's latest.
      # OpenClaw ships a new stable nearly every day, so we don't enforce this
      # on every PR/commit (would be busy-work) — but we DO refuse to publish
      # a release that lags behind. Run `npm run bump:openclaw` and re-cut the
      # release if this fails.
      - name: Verify openclaw is on the latest version
        run: |
          LATEST=$(npm view openclaw version)
          echo "Latest openclaw on npm: $LATEST"

          CURRENT_DEV=$(node -p "require('./package.json').devDependencies.openclaw")
          CURRENT_BUILT=$(node -p "require('./package.json').openclaw.compat.builtWithOpenClawVersion")
          CURRENT_SDK=$(node -p "require('./package.json').openclaw.compat.pluginSdkVersion")
          CURRENT_DEV_VERSION=$(echo "$CURRENT_DEV" | sed -E 's/^[^0-9]*//')

          FAIL=0
          if [ "$CURRENT_DEV_VERSION" != "$LATEST" ]; then
            echo "::error::devDependencies.openclaw is \"$CURRENT_DEV\" (resolves to $CURRENT_DEV_VERSION), latest on npm is $LATEST. Bump it before releasing."
            FAIL=1
          fi
          if [ "$CURRENT_BUILT" != "$LATEST" ]; then
            echo "::error::openclaw.compat.builtWithOpenClawVersion is \"$CURRENT_BUILT\", latest on npm is $LATEST. Bump it before releasing."
            FAIL=1
          fi
          if [ "$CURRENT_SDK" != "$LATEST" ]; then
            echo "::error::openclaw.compat.pluginSdkVersion is \"$CURRENT_SDK\", latest on npm is $LATEST. Bump it before releasing."
            FAIL=1
          fi
          if [ "$FAIL" = "1" ]; then
            echo "Run: npm run bump:openclaw && commit + re-cut the release."
            exit 1
          fi
          echo "All openclaw version fields are up to date ($LATEST)."

      - name: Extract release version
        run: |
          FULL_TAG_NAME="${{ github.event.release.tag_name }}"
          VERSION_NUMBER="${FULL_TAG_NAME#v}"
          echo "VERSION=${VERSION_NUMBER}" >> $GITHUB_ENV

      # Make the bump idempotent: if a prior failed run already pushed the
      # version commit to main, the tag points at a tree that already has the
      # target version. `npm version X` errors out in that case ("Version not
      # changed"), so we pre-check and skip both the bump and the commit step.
      - name: Check if version bump is needed
        id: version_check
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          if [ "$CURRENT" = "${{ env.VERSION }}" ]; then
            echo "package.json is already at ${{ env.VERSION }}, skipping bump."
            echo "needs_bump=false" >> "$GITHUB_OUTPUT"
          else
            echo "package.json is at $CURRENT, will bump to ${{ env.VERSION }}."
            echo "needs_bump=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update package.json version
        if: steps.version_check.outputs.needs_bump == 'true'
        run: npm version "${{ env.VERSION }}" --no-git-tag-version

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npx vitest run

      - name: Build
        run: npm run build

      - name: Commit version bump
        if: steps.version_check.outputs.needs_bump == 'true'
        uses: apify/actions/signed-commit@v1.1.2
        with:
          message: "chore(release): v${{ env.VERSION }} [skip ci]"
          add: 'package.json package-lock.json'
          github-token: ${{ secrets.APIFY_SERVICE_ACCOUNT_GITHUB_TOKEN }}
          branch: ${{ github.event.release.target_commitish }}

      - name: Publish to npm
        run: |
          if npm view @apify/apify-openclaw-plugin@${{ env.VERSION }} version > /dev/null 2>&1; then
            echo "Version ${{ env.VERSION }} of @apify/apify-openclaw-plugin is already published to npm. Skipping publish step."
          else
            echo "Publishing @apify/apify-openclaw-plugin@${{ env.VERSION }} to npm..."
            npm publish --provenance --access public
          fi

  publish-clawhub:
    needs: release
    permissions:
      contents: read
      id-token: write
    uses: openclaw/clawhub/.github/workflows/package-publish.yml@v0.12.0
    with:
      dry_run: false
      ref: ${{ github.event.release.target_commitish }}
      owner: apify
    secrets:
      clawhub_token: ${{ secrets.APIFY_CLAWHUB_TOKEN }}
