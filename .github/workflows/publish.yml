name: Release & Publish to npm and ClawHub

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.APIFY_SERVICE_ACCOUNT_GITHUB_TOKEN }}
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Set up Node.js & cache npm
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      # npm trusted publishing (OIDC) needs npm >= 11.5. Node 22 ships npm 10.x,
      # so we upgrade. Running `npm install -g npm@X` with the bundled npm
      # races against itself (it overwrites its own files mid-execution, then
      # fails to `require` removed internal modules). Use npx to fetch the
      # target npm into a separate location and let *that* npm do the global
      # install — running process and target path are distinct, no race.
      #
      # Pinned to a major (NOT npm@latest): a floating major silently changes
      # how `npm ci` validates package-lock.json mid-flight. npm 12 rejected an
      # npm 11-generated lock (a nested exact-version dep npm 11 had omitted),
      # which broke releases with no repo change at all. ci.yml pins the SAME
      # major so lock drift fails a PR instead of a release. To move majors:
      # bump NPM_VERSION in both workflows, regenerate the lock with that npm
      # (`npx -y npm@<major> install`), and commit the result together.
      - name: Upgrade npm for trusted publishing
        env:
          NPM_VERSION: '12'
        run: |
          npx -y "npm@${NPM_VERSION}" install -g "npm@${NPM_VERSION}"
          npm --version

      - name: Install dependencies
        run: npm ci

      # Gate publishing on the pinned openclaw version not lagging behind npm's
      # latest. OpenClaw ships a new release nearly every day, so we don't
      # enforce this on every PR/commit (would be busy-work) — but we DO refuse
      # to publish a release that lags behind. Run `npm run bump:openclaw` and
      # re-cut the release if this fails.
      #
      # The comparison lives in scripts/openclaw-version.mjs so this gate, the
      # bump script and the version-test matrix all agree on what "latest" is —
      # notably that openclaw's `X.Y.Z-N` re-releases are releases, not
      # pre-releases. Being *ahead* of latest is fine and does not fail.
      - name: Verify openclaw is on the latest version
        run: node scripts/openclaw-version.mjs check

      - name: Extract release version
        run: |
          FULL_TAG_NAME="${{ github.event.release.tag_name }}"
          VERSION_NUMBER="${FULL_TAG_NAME#v}"
          echo "VERSION=${VERSION_NUMBER}" >> $GITHUB_ENV

      # Make the bump idempotent: if a prior failed run already pushed the
      # version commit to main, the tag points at a tree that already has the
      # target version. `npm version X` errors out in that case ("Version not
      # changed"), so we pre-check and skip both the bump and the commit step.
      - name: Check if version bump is needed
        id: version_check
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          if [ "$CURRENT" = "${{ env.VERSION }}" ]; then
            echo "package.json is already at ${{ env.VERSION }}, skipping bump."
            echo "needs_bump=false" >> "$GITHUB_OUTPUT"
          else
            echo "package.json is at $CURRENT, will bump to ${{ env.VERSION }}."
            echo "needs_bump=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update package.json version
        if: steps.version_check.outputs.needs_bump == 'true'
        run: npm version "${{ env.VERSION }}" --no-git-tag-version

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npx vitest run

      - name: Build
        run: npm run build

      - name: Commit version bump
        if: steps.version_check.outputs.needs_bump == 'true'
        uses: apify/actions/signed-commit@v1.1.2
        with:
          message: "chore(release): v${{ env.VERSION }} [skip ci]"
          add: 'package.json package-lock.json'
          github-token: ${{ secrets.APIFY_SERVICE_ACCOUNT_GITHUB_TOKEN }}
          branch: ${{ github.event.release.target_commitish }}

      - name: Publish to npm
        run: |
          if npm view @apify/apify-openclaw-plugin@${{ env.VERSION }} version > /dev/null 2>&1; then
            echo "Version ${{ env.VERSION }} of @apify/apify-openclaw-plugin is already published to npm. Skipping publish step."
          else
            echo "Publishing @apify/apify-openclaw-plugin@${{ env.VERSION }} to npm..."
            npm publish --provenance --access public
          fi

  publish-clawhub:
    needs: release
    permissions:
      contents: read
      id-token: write
    uses: openclaw/clawhub/.github/workflows/package-publish.yml@v0.12.0
    with:
      dry_run: false
      ref: ${{ github.event.release.target_commitish }}
      owner: apify
    secrets:
      clawhub_token: ${{ secrets.APIFY_CLAWHUB_TOKEN }}
